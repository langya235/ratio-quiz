name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk git zip unzip python3-pip wget

      - name: Install Python deps
        run: |
          pip install --user buildozer cython

      # 1) 官方 cmdline-tools 下载并放到 $ANDROID_SDK_ROOT
      - name: Download Android SDK cmdline-tools
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d $ANDROID_SDK_ROOT
          # 组织成官方要求的目录结构
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv $ANDROID_SDK_ROOT/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/ 2>/dev/null || true
          # 永久写入环境变量
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      # 2) 接受许可证 & 安装 build-tools + 平台
      - name: Install Android build-tools / platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      # 3) 让 buildozer 使用我们准备好的 SDK
      - name: Generate spec & build
        run: |
          buildozer init
          sed -i 's/^title.*/title = RatioQuiz/' buildozer.spec
          sed -i 's/^package.name.*/package.name = ratioquiz/' buildozer.spec
          sed -i 's/^requirements.*/requirements = python3,kivy/' buildozer.spec
          # 指定 SDK 路径，防止 buildozer 重新下载
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
