name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Buildozer
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk git zip unzip python3-pip
          pip install --user buildozer cython
      - name: Accept Android SDK licenses
        run: |
          yes | sudo /usr/local/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Install Android SDK Build-Tools
        run: |
          /usr/local/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"
      - name: Pre-download Android SDK
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          buildozer android p4a --help || true
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"
      - name: Generate spec & build
        run: |
          buildozer init
          sed -i 's/^title.*/title = RatioQuiz/' buildozer.spec
          sed -i 's/^package.name.*/package.name = ratioquiz/' buildozer.spec
          sed -i 's/^requirements.*/requirements = python3,kivy/' buildozer.spec
          buildozer android debug
      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
