name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk git zip unzip python3-pip

      - name: Install Python deps
        run: |
          pip install --user buildozer cython

      - name: Pre-download Android SDK & install build-tools
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          # 触发 p4a 自动下载 cmdline-tools
          buildozer android p4a --help || true
          # 接受许可证并安装 build-tools / platform
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Generate spec & build APK
        run: |
          buildozer init
          # 修改关键字段
          sed -i 's/^title.*/title = RatioQuiz/' buildozer.spec
          sed -i 's/^package.name.*/package.name = ratioquiz/' buildozer.spec
          sed -i 's/^requirements.*/requirements = python3,kivy/' buildozer.spec
          # 开始编译
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
